name: Secret scan (gitleaks)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks-scan:
    name: Run gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "${release_url}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location "${release_url}/${checksums}" --output "${checksums}"
          grep -F "  ${archive}" "${checksums}" > archive.sha256
          sha256sum --check --strict archive.sha256
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks scan
        run: |
          gitleaks detect --source=. --config .gitleaks.toml --redact --exit-code 1
